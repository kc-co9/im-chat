global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: im-http-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19010]
  - job_name: im-ws-gateway-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19011]
  - job_name: im-broker-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19020]
  - job_name: im-account-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19030]
  - job_name: im-social-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19031]
  - job_name: im-message-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19032]
  - job_name: im-iam-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19040]
  - job_name: im-audit-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19041]
  - job_name: im-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19042]
  - job_name: im-monitor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:19043]
  - job_name: skywalking-oap
    metrics_path: /metrics
    static_configs:
      - targets: [skywalking-oap:1234]
