spring:
  application:
    name: im-broker
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=${im.nacos.config.infra-group:INFRA_GROUP}
  cloud:
    nacos:
      discovery:
        port: ${im.bolt.server.port}
        metadata:
          management-host: ${im.broker.management.host}

management:
  server:
    port: 19020
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

server:
  address: ${im.broker.management.bind-host}
  port: ${im.broker.management.port}

springdoc:
  swagger-ui:
    path: /api/doc.html
  api-docs:
    path: /v3/api-docs

im:
  session:
    web:
      public-paths:
        - /management/**
        - /actuator/**
        - /api/doc.html
        - /v3/api-docs/**
  bolt:
    client:
      enabled: true
    server:
      enabled: true
      port: 18020
  broker:
    management:
      bind-host: 127.0.0.1
      host: 127.0.0.1
      port: 19020
      history-capacity: 100
    instance:
      host: ${IM_BROKER_HOST:127.0.0.1}
      port: ${im.bolt.server.port}
    cluster:
      seed-addresses: []
      gossip-fanout: 2
      gossip-timeout-millis: 3000
      gossip-removed-ttl-millis: 300000
    registry:
      broker-ttl: 60s
      gateway-ttl: 60s
      connection-ttl: 60s
    gateway-push:
      bolt:
        timeout-millis: 3000
    peer-call:
      timeout-millis: 3000
