spring:
  application:
    name: im-iam
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=${im.nacos.config.infra-group:INFRA_GROUP}
  cloud:
    stream:
      bindings:
        auditOutput:
          destination: im.audit.im-iam.v1

server:
  port: 18040

management:
  server:
    port: 19040
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /api/doc.html
  api-docs:
    path: /v3/api-docs

im:
  datasource:
    sharding:
      enabled: true
      config-location: classpath:im-sharding.yml
  iam:
    authorization:
      issuer: http://localhost:18040
      key-store-location: classpath:iam/iam-signing.p12
      key-store-password: ImChatIamLocalStore_2026!
      key-alias: im-iam-signing
      key-password: ImChatIamLocalStore_2026!
    bootstrap:
      enabled: true
      username: admin
      email: admin@imchat.com
      password: admin
  identity:
    snowflake:
      mode: REDIS
      data-center-id: 0
  audit:
    enabled: true
    transport: kafka
    kafka:
      binding-name: auditOutput
