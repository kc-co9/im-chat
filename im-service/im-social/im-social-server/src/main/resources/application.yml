server:
  port: 18031
  servlet:
    context-path: /social

management:
  server:
    port: 19031
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /api/doc.html
  api-docs:
    path: /v3/api-docs

im:
  datasource:
    sharding:
      enabled: true
      config-location: classpath:im-sharding.yml
  identity:
    snowflake:
      mode: STATIC
      data-center-id: 1
      machine-id: 1

spring:
  application:
    name: im-social
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=${im.nacos.config.service-group:SERVICE_GROUP}
