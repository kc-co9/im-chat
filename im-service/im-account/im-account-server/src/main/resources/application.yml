server:
  port: 18030
  servlet:
    context-path: /account

management:
  server:
    port: 19030
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /api/doc.html
  api-docs:
    path: /v3/api-docs

im:
  datasource:
    sharding:
      enabled: true
      config-location: classpath:im-sharding.yml
  identity:
    snowflake:
      mode: STATIC
      data-center-id: 1
      machine-id: 1
  bolt:
    client:
      enabled: true
  session:
    web:
      public-paths:
        - /user/signUp
        - /user/signIn
        - /user/refreshToken
    jwt:
      enabled: true
      secret: 65fe0d3158a24a4f9524b7d7e0d4821d9571a8ed5d7da588f715a46a96531b7783a27152ca4b2219835cf0b266ab9fe1d3d5b1c7e37a4481674233894ed40acf
  account:
    broker:
      timeout-millis: 3000

spring:
  application:
    name: im-account
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=${im.nacos.config.service-group:SERVICE_GROUP}
