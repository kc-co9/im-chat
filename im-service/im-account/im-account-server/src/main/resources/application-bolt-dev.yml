im:
  bolt:
    client:
      mode: DEVELOPMENT_PLAINTEXT
      tls:
        enabled: false
      development:
        synthetic-data: ${IM_BOLT_SYNTHETIC_DATA:false}
        isolated-container-network: ${IM_BOLT_ISOLATED_CONTAINER_NETWORK:false}
  account:
    broker:
      bootstrap-targets:
        - address: ${IM_BROKER_ROUTE_ENDPOINT:127.0.0.1:18020}
          expected-peer-identity: spiffe://im-chat/broker/${IM_BROKER_NODE_ID:broker-local-1}
