<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台模板</title>
    <link rel="stylesheet" th:href="@{/css/amazeui.css}"/>
    <link rel="stylesheet" th:href="@{/css/core.css}"/>
    <link rel="stylesheet" th:href="@{/css/menu.css}"/>
    <link rel="stylesheet" th:href="@{/css/index.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
    <link rel="stylesheet" th:href="@{/css/page/typography.css}"/>
    <link rel="stylesheet" th:href="@{/css/page/form.css}"/>
    <link rel="stylesheet" th:href="@{/css/component.css}"/>

    <script type="text/javascript" th:src="@{/js/jquery-2.1.0.js}"></script>
    <script type="text/javascript" th:src="@{/js/amazeui.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/app.js}"></script>
    <script type="text/javascript" th:src="@{/js/blockUI.js}"></script>
    <script type="text/javascript" th:src="@{/js/charts/echarts.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/charts/indexChart.js}"></script>
    <script type="text/javascript" th:src="@{/js/handlebars-v4.1.1.js}"></script>

    <script type="text/javascript" th:src="@{/js/common.js}"></script>

    <script id="friend-list-template" type="text/x-handlebars-template">
        {{#each data}}
        <li>
            <a id="friend-{{userId}}" th:href="@{/route/user/chat}+'/'+'{{userId}}'+'?token='+'{{../token}}'">{{nickname}}
                <span>{{status}}</span></a>
        </li>
        {{/each}}
    </script>

    <script id="friend-item-template" type="text/x-handlebars-template">
        <li>
            <a id="friend-{{userId}}" th:href="@{/route/user/chat}+'/'+'{{userId}}'+'?token='+'{{../token}}'">{{nickname}}
                <span>{{status}}</span></a>
        </li>
    </script>

    <script id="friend-message-template" type="text/x-handlebars-template">
        <li class="am-comment">
            <p>{{data}}</p>
            <a href="#link-to-user-home">
                <img src="{{toUserAvatar}}" alt=""
                     class="am-comment-avatar" width="60px" height="60px"/>
            </a>
            <div class="am-comment-main">
                <div class="am-comment-bd" style="background: white">{{content}}</div>
            </div>
        </li>

    </script>

    <script id="user-message-template" type="text/x-handlebars-template">
        <li class="am-comment am-comment-flip">
            <a href="#link-to-user-home">
                <img src="{{fromUserAvatar}}" alt=""
                     class="am-comment-avatar" width="60px" height="60px"/>
            </a>
            <div class="am-comment-main">
                <div class="am-comment-bd" style="background: white">{{content}}</div>
            </div>
        </li>
    </script>

    <script th:inline="javascript">
        var websocket = null;
        var friendId = null;
        var userId = null;
        window.onload = function () {
            // 初始化内容
            initWebSocket();

            init();


        };

        function init() {
            getFriendList();


            listMessage();
        }



        function initWebSocket() {
            userId = /*[[${user.userId}]]*/;
            friendId = /*[[${friend.userId}]]*/
            var url = "ws://" + window.location.host + "/chatServer/" + userId + "/" + friendId;
            // var url = "ws://127.0.0.1:8080/chatServer/" + userId;
            //判断当前浏览器是否支持WebSocket
            if ('WebSocket' in window) {
                // 不带参数的写法
                // websocket = new WebSocket("ws://127.0.0.1:8080/chatServer");
                // 通过路径传递参数的方法（服务端采用第一种方法"@ServerEndpoint"实现）
                websocket = new WebSocket(url);
                // 通过类似GET请求方式传递参数的方法（服务端采用第二种方法"WebSocketHandler"实现）
                // websocket = new WebSocket("ws://127.0.0.1:8080/chatServer?id=23&name=Lebron");
            } else {
                alert('当前浏览器 Not support websocket')
            }
            //连接发生错误的回调方法
            websocket.onerror = function () {
                setSystemMessage("WebSocket连接发生错误");
            };

            //连接成功建立的回调方法
            websocket.onopen = function () {
                setSystemMessage("WebSocket连接成功");
            };

            //接收到消息的回调方法
            websocket.onmessage = function (event) {
                setMessageInnerHTML(event.data);
            };

            //连接关闭的回调方法
            websocket.onclose = function () {
                setSystemMessage("WebSocket连接关闭");
            };

            //监听窗口关闭事件，当窗口关闭时，主动去关闭websocket连接，防止连接还没断开就关闭窗口，server端会抛异常。
            window.onbeforeunload = function () {
                closeWebSocket();
            };
        }


        //将消息显示在网页上
        function setMessageInnerHTML(data) {
            console.log(data);
            data = eval("(" + data + ")");
            var type = data.type;
            var msgBody = data.msgBody;
            if (2 === type) {
                var fromUid = msgBody.fromUid;
                var template;
                //自己发送的
                if (fromUid === userId) {
                    template = Handlebars.compile($("#user-message-template").html());
                } else {
                    //注册一个Handlebars模版，通过id找到某一个模版，获取模版的html框架
                    //$("#table-template").html()是jquery的语法，不懂的童鞋请恶补。。。
                    template = Handlebars.compile($("#friend-message-template").html());
                    //将json对象用刚刚注册的Handlebars模版封装，得到最终的html，插入到基础table中。
                }
                $('#messageList').append(template(msgBody));

                moveToBottom();
            } else if (type === 3) {
                console.log(msgBody);
            } else if(type === 0){
                // var html = msgBody.nickname + ' <span>' + msgBody.status + '</span>';
                // $("#friend-"+msgBody.userId).html(html);
            }
        }

        function setSystemMessage(data) {
            console.log(data);
        }

        //关闭WebSocket连接
        function closeWebSocket() {
            websocket.close();
        }

        //发送消息
        function send() {
            var toUid = /*[[${friend.userId}]]*/;
            var content = $("#doc-ta-1").val();

            var data = {
                "fromUid": userId,
                "toUid": toUid,
                "content": content,
                "status": 0
            };
            var jsonStr = JSON.stringify(data);
            websocket.send(jsonStr);

            //清空输入框
            $("#doc-ta-1").val('');
        }

        function listMessage() {
            var url = /*[[@{/user/message/listChatMsgWithFriend}]]*/;
            url = url + '/' + friendId;
            url = url + "?pageIndex=" + 0 + "&pageSize=" + 50;
            var token = getToken();
            var header = {
                "token": token
            };
            get(url, header, function (data) {
                //解析数据
                data = eval("(" + data + ")");
                data = data.data.list;

                for (var i = 0; i < data.length; i++) {
                    var fromUid = data[i].fromUid;
                    var template;
                    //自己发送的
                    if (fromUid === userId) {
                        template = Handlebars.compile($("#user-message-template").html());
                    } else {
                        //注册一个Handlebars模版，通过id找到某一个模版，获取模版的html框架
                        //$("#table-template").html()是jquery的语法，不懂的童鞋请恶补。。。
                        template = Handlebars.compile($("#friend-message-template").html());
                        //将json对象用刚刚注册的Handlebars模版封装，得到最终的html，插入到基础table中。
                    }

                    $('#messageList').append(template(data[i]));

                    moveToBottom();
                }
            });
        }

        function getFriendList() {
            var url = /*[[@{/user/listFriends}]]*/;
            var token = getToken();
            var header = {
                "token": token
            };

            get(url, header, function (data) {
                //解析JSON
                console.log(data);
                var result = eval("(" + data + ")");
                result.token = getToken();
                console.log(result);

                //注册一个Handlebars模版，通过id找到某一个模版，获取模版的html框架
                //$("#table-template").html()是jquery的语法，不懂的童鞋请恶补。。。
                var template = Handlebars.compile($("#friend-list-template").html());
                //将json对象用刚刚注册的Handlebars模版封装，得到最终的html，插入到基础table中。
                $('#collapse-nav1').html(template(result));
            });
        }

        function moveToBottom() {
            $("#messageListDiv")[0].scrollTop = $("#messageListDiv")[0].scrollHeight;
        }
    </script>
</head>
<body>
<!-- Begin page -->
<header class="am-topbar am-topbar-fixed-top">
    <div class="am-topbar-left am-hide-sm-only">
        <a href="index.html" class="logo"><span>Admin<span>to</span></span><i class="zmdi zmdi-layers"></i></a>
    </div>

    <div class="contain">
        <ul class="am-nav am-navbar-nav am-navbar-left">
            <li>
                <h4 class="page-title">
                    <span onclick="back2Index()" class="am-icon-chevron-left"></span>
                    <span class="am-text-center" th:text="${friend.nickname}"></span>
                </h4>
                <script th:inline="javascript">
                    function back2Index() {
                        var url = /*[[@{/route/index}]]*/;
                        var token = getToken();
                        //结束会话

                        //跳转地址
                        window.location.href = url + "?token=" + token;
                    }
                </script>
            </li>
        </ul>

        <ul class="am-nav am-navbar-nav am-navbar-right">
            <li class="inform am-icon-th-list am-show-sm-only"
                data-am-offcanvas="{target: '#admin-offcanvas'}">
            </li>

            <li class="hidden-xs am-hide-sm-only">
                <form role="search" class="app-search">
                    <input type="text" placeholder="Search..." class="form-control">
                    <a href=""><img th:src="@{/img/search.png}"></a>
                </form>
            </li>
        </ul>
    </div>
</header>
<!-- end page -->


<div class="admin">

    <!-- ========== Left Sidebar Start ========== -->

        <div class="slimScrollDiv" style="position: relative; overflow: hidden; width: auto; height: 548px;">
            <div class="sidebar-inner slimscrollleft" style="overflow: hidden; width: auto; height: 548px;">-->

    <!--</div>
</div>
</div>-->
    <!-- ========== Left Sidebar end ========== -->


    <!--	<div class="am-g">-->
    <!-- ============================================================== -->
    <!-- Start right Content here -->
    <div class="content-page">
        <!-- Start content -->
        <div class="content" style="height: 100%">
            <!--显示消息框-->
            <div id="messageListDiv" class="am-cf am-padding-sm am-scrollable-vertical" style="height: 90%">
                <ul id="messageList" class="am-comments-list">


                </ul>
            </div>

            <!--输入框-->
            <div class="am-g am-cf am-vertical-align"
                 style="height: 10%;padding: 0;margin: 0;bottom: 0;background: #dce6ef;box-shadow: darkgray 0 0 2px 0">
                <div class="am-vertical-align-middle">
                    <div class="am-u-sm-10 am-vertical-align-middle" style="padding: 0;margin: 0;">
                        <textarea class="" rows="1" id="doc-ta-1" style="margin: 0;"></textarea>
                    </div>
                    <div class="am-u-sm-2 am-vertical-align-middle" style="padding: 0">
                        <button onclick="send()" type="button" class="am-btn am-btn-primary am-radius">发送</button>
                    </div>
                </div>
            </div>

        </div>
        <!-- end content -->
    </div>

</div>
