<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" th:href="@{/css/core.css}"/>
    <link rel="stylesheet" th:href="@{/css/menu.css}"/>
    <link rel="stylesheet" th:href="@{/css/amazeui.css}"/>
    <link rel="stylesheet" th:href="@{/css/component.css}"/>
    <link rel="stylesheet" th:href="@{/css/page/form.css}"/>

    <script type="text/javascript" th:src="@{/js/jquery-2.1.0.js}"></script>
    <script type="text/javascript" th:src="@{/js/common.js}"></script>
</head>
<body>
<div class="account-pages">
    <div class="wrapper-page">
        <div class="text-center">
            <a href="index.html" class="logo"><span>Admin<span>to</span></span></a>
        </div>

        <div class="m-t-40 card-box">
            <div class="text-center">
                <h4 class="text-uppercase font-bold m-b-0">Sign In</h4>
            </div>
            <div class="panel-body">
                <form class="am-form">
                    <div class="am-g">
                        <div class="am-form-group">
                            <input id="email" type="email" class="am-radius" placeholder="账号">
                        </div>

                        <div class="am-form-group form-horizontal m-t-20">
                            <input id="password" type="password" class="am-radius" placeholder="密码">
                        </div>


                        <div class="am-form-group ">
                            <label style="font-weight: normal;color: #999;">
                                <input type="checkbox" class="remeber"> Remember me
                            </label>
                        </div>

                        <div class="am-form-group ">
                            <button onclick="login();" id="loginBtn" type="button"
                                    class="am-btn am-btn-primary am-radius"
                                    style="width: 100%;height: 100%;">登录
                            </button>
                            <script th:inline="javascript">
                                function login() {
                                    var url = /*[[@{/account/login}]]*/;
                                    var data = {
                                        "email": $("#email").val(),
                                        "password": $("#password").val()
                                    };
                                    post(url, null, data, function (data) {
                                        var result = eval("(" + data + ")")

                                        //存token
                                        saveToken(result.data);

                                        //websocket连接

                                        //跳转
                                        window.location.href = /*[[@{/route/index}]]*/;

                                    }, function () {
                                        //重新登录
                                        location.reload();
                                    });
                                }
                            </script>
                        </div>

                        <div class="am-form-group ">
                            <a href="#" class="text-muted"><i class="fa fa-lock m-r-5"></i> 忘记密码</a>
                        </div>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
</body>
</html>
