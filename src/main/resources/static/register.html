<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 即时通讯应用</title>
    <link rel="stylesheet" href="css/wechat.css">
    <link rel="stylesheet" href="css/font-awesome.css">
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <h2>创建账号</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
                </div>
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="agree-terms" required> 我已阅读并同意<a href="#" class="terms-link">服务条款</a>和<a href="#" class="privacy-link">隐私政策</a>
                    </label>
                </div>
                <button type="submit" class="register-btn">注册</button>
                <div class="login-link">
                    <p>已有账号？<a href="login.html">立即登录</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/jquery-2.1.0.js"></script>
    <script>
        // 注册表单提交事件
        $('#register-form').submit(function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const username = $('#username').val();
            const email = $('#email').val();
            const password = $('#password').val();
            const confirmPassword = $('#confirmPassword').val();
            
            // 表单验证
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            if (password.length < 6) {
                alert('密码长度不能少于6个字符');
                return;
            }
            
            // 发送注册请求
            $.ajax({
                url: '/user/signUp',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                }),
                success: function(response) {
                if (response.code === 0) {
                    // 注册成功，跳转到登录页面
                    alert('注册成功，请登录');
                    window.location.href = 'login.html';
                } else {
                    // 注册失败，显示错误信息
                    alert('注册失败：' + (response.msg || '未知错误'));
                }
                },
                error: function(xhr, status, error) {
                    // 请求失败，显示错误信息
                    alert('注册失败：' + error);
                }
            });
        });
    </script>
</body>
</html>
