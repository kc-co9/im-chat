<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 即时通讯应用</title>
    <link rel="stylesheet" href="css/wechat.css">
    <link rel="stylesheet" href="css/font-awesome.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>即时通讯应用</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="remember-me"> 记住我
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>
                <button type="submit" class="login-btn">登录</button>
                <div class="register-link">
                    <p>还没有账号？<a href="register.html">立即注册</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/jquery-2.1.0.js"></script>
    <script>
        // 登录表单提交事件
        $('#login-form').submit(function(e) {
            e.preventDefault();
            
            // 获取表单数据
            const email = $('#email').val();
            const password = $('#password').val();
            const rememberMe = $('#remember-me').is(':checked');
            
            // 发送登录请求
            $.ajax({
                url: '/user/signIn',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    email: email,
                    password: password,
                    rememberMe: rememberMe
                }),
                success: function(response) {
                    if (response.code === 0) {
                        // 登录成功，获取token
                        const token = response.data.token;
                        
                        // 跳转到聊天页面，只传递token参数
                        window.location.href = `chat.html?token=${token}`;
                    } else {
                        // 登录失败，显示错误信息
                        alert('登录失败：' + (response.msg || '未知错误'));
                    }
                },
                error: function(xhr, status, error) {
                    // 请求失败，显示错误信息
                    alert('登录失败：' + error);
                }
            });
        });
    </script>
</body>
</html>
