name: Harness Garbage Collection

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/harness-gc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: harness-gc-report
          path: target/harness/report.json
