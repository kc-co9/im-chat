name: Verify

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Check environment readiness
        run: ./scripts/verify.sh readiness
      - name: Check repository handoff state
        run: ./scripts/verify.sh clean
      - name: Verify affected modules
        run: ./scripts/verify.sh affected ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Publish Harness report
        if: always()
        run: ./scripts/verify.sh report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          include-hidden-files: true
          path: |
            .harness/report.json
            .harness/verifications/*.json
            .harness/runtime/e2e.log

  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Check environment readiness
        run: ./scripts/verify.sh readiness
      - name: Check repository handoff state
        run: ./scripts/verify.sh clean
      - name: Verify realtime E2E and retain runtime evidence
        run: ./scripts/verify.sh e2e
      - name: Verify all application startup smoke
        run: ./scripts/verify.sh startup
      - run: ./scripts/verify.sh full
      - name: Publish full Harness report
        if: always()
        run: ./scripts/verify.sh report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-full-report
          include-hidden-files: true
          path: |
            .harness/report.json
            .harness/verifications/*.json
            .harness/runtime/e2e.log
            .harness/session-handoff.*
            .harness/startup-manifest.json
