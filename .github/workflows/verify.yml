name: Verify

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify affected modules
        run: ./scripts/verify.sh affected ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Publish Harness report
        if: always()
        run: ./scripts/verify.sh report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: target/harness/report.json

  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./scripts/verify.sh full
      - name: Publish full Harness report
        if: always()
        run: ./scripts/verify.sh report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-full-report
          path: target/harness/report.json
